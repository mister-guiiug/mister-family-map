<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mister Family Map">
  <!--
    LE MASKABLE, ET POURQUOI CE N'EST PAS `favicon.svg` EN PLUS PETIT.

    Le PNG livré jusqu'ici sortait du générateur du socle en mode maskable, sans
    qu'on lui donne de couleur de fond : la tuile arrondie était donc réduite sur
    le fond PAR DÉFAUT, rgb(12,18,34). Ce bleu nuit n'a rien à voir avec le vert
    de la tuile — mesuré sur le fichier, le coin rendait rgb(12,18,34) quand
    l'intérieur rendait rgb(151,181,163). Le résultat était une vignette verte
    posée au milieu d'un cadre bleu foncé, et c'est ce cadre qu'Android montrait.

    UNE SEULE DIFFÉRENCE AVEC LA SOURCE : le fond perd ses coins. `rx="28"`
    disparaît, le vert occupe la toile entière, et il n'y a plus de bord à
    raccorder quel que soit le masque de l'appareil.

    LE DESSIN, LUI, NE BOUGE PAS — et c'est la mesure qui le dit : centré, il
    atteint 184 px pour une zone de sécurité à 204,8. Il tient déjà, avec vingt
    pixels de marge. Le réduire « pour faire comme les autres » lui ferait perdre
    de la présence sans rien protéger.

    Icône TEMPORAIRE (pictogramme générique), comme `favicon.svg` : à remplacer
    par le vrai logo, puis relancer `npm run icons` ET `npm run icons:maskable`.
  -->
  <rect width="128" height="128" fill="#2f6f4f"/>
  <g>
    <path d="M64 18c-19.9 0-36 15.7-36 35 0 26.3 36 57 36 57s36-30.7 36-57c0-19.3-16.1-35-36-35z" fill="#fdfaf5"/>
    <path d="M64 76.5 49.6 62.4c-4.8-4.7-4.8-12.3 0-17 4.7-4.7 12.4-4.7 17.1 0l-2.7 2.6 2.7-2.6c4.7-4.7 12.4-4.7 17.1 0 4.8 4.7 4.8 12.3 0 17L64 76.5z" fill="#e0704f"/>
  </g>
</svg>
