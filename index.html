<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP statique de repli (dev / ouverture directe). À la build, cspPlugin la
      REMPLACE par une CSP durcie : script-src par hash SHA-256 (pas de
      'unsafe-inline' en prod) + hôtes réels (tuiles OSM, Supabase, Nominatim).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://tile.openstreetmap.org https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />

    <!-- Script anti-FOUC : applique le thème avant tout rendu (clé alignée useTheme). -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('dwc_theme');
          var eff =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          document.documentElement.style.colorScheme = eff;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Analytics (GTM/GA4) injecté par pwaSeoPlugin() si configuré. -->
    __ANALYTICS_HEAD__

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f6f4f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Mister Family Map" />

    <meta
      name="description"
      content="Idées de sorties en famille : carte collaborative des lieux, agenda des événements et retours d'expérience réellement utiles."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <title>Mister Family Map</title>
  </head>
  <body>
    __ANALYTICS_BODY__
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
