<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP statique de repli (dev / ouverture directe). À la build, cspPlugin la
      REMPLACE par une CSP durcie : script-src par hash SHA-256 (pas de
      'unsafe-inline' en prod) + hôtes réels (tuiles OSM, Supabase, Nominatim).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://tile.openstreetmap.org https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />

    <!-- Script anti-FOUC : applique le thème avant tout rendu (clé alignée useTheme). -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('dwc_theme');
          var eff =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', eff);
          document.documentElement.style.colorScheme = eff;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Aucune mesure n'est injectée ici : `ConsentBanner` charge PostHog
         depuis le navigateur, et seulement après l'accord. -->
    <!--
      LES MARQUEURS `__ANALYTICS_*__` ONT ÉTÉ RETIRÉS.

      `pwaSeoPlugin` les remplaçait AU BUILD par le tag de Google dès qu'un
      identifiant était posé — précédé d'un `consent default` tout refusé, donc
      sans collecte, mais le script partait quand même au chargement de la
      page.

      `ConsentBanner` fait le même travail autrement : il n'injecte RIEN avant
      l'accord. Garder les deux chemins ferait partir DEUX tags le jour où la
      variable serait posée — le socle porte deux réponses à la même question,
      et cette app n'en garde qu'une.
    -->

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f6f4f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Mister FamilyMap" />

    <meta
      name="description"
      content="Trouvez des idées de sorties en famille : carte collaborative des lieux, agenda des événements et retours d'expérience partagés entre familles."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <title>Mister FamilyMap — idées de sorties en famille</title>
    <meta
      property="og:title"
      content="Mister FamilyMap — idées de sorties en famille"
    />
    <meta
      property="og:description"
      content="Trouvez des idées de sorties en famille : carte collaborative des lieux, agenda des événements et retours d'expérience partagés entre familles."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mister FamilyMap" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
