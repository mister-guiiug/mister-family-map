# Budget qualité (perf / a11y / best-practices / SEO) sur PR, via le reusable
# pwa-lighthouse.yml@v3. Seuils dans .lighthouserc.json.
name: Lighthouse
on:
  pull_request:

# ⚠️ Le reusable déclare `pull-requests: write` : le caller doit l'accorder
# aussi (héritage par intersection), sinon le run échoue en startup_failure.
permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lighthouse:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-lighthouse.yml@v3
    secrets: inherit
