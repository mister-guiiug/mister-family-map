# Déploiement GitHub Pages : délégué au reusable pwa-deploy.yml@v4.
#
# L'app est servie sous https://mister-guiiug.github.io/mister-family-map/
# (base path automatique).
#
# ⚠️ Permissions au niveau caller (héritage par intersection) :
#   - pages: write + id-token: write → déploiement Pages ;
#   - packages: read → installation de @mister-guiiug/dev-pwa-config.
# ⚠️ Ne PAS déclarer `concurrency: pages` ici : le reusable le déclare déjà
# (un doublon caller/reusable provoque un interblocage documenté).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v6
    # PAS de `secrets: inherit` : le seul secret déclaré par
    # `pwa-deploy.yml` est `FIREBASE_SERVICE_ACCOUNT_KEY`, et ce dépôt ne
    # déploie pas sur Firebase. Hériter enverrait TOUS les secrets du dépôt
    # à un workflow qui n'en attend aucun ici.
    with:
      use-base-path: true
      # Variables de build applicatives (aucun secret ici — la clé anon
      # Supabase est publique par conception, mais elle vit dans les secrets
      # du dépôt pour rester hors du code source) :
      #   VITE_SUPABASE_URL=...
      #   VITE_SUPABASE_ANON_KEY=...
      #
      # LA VARIABLE SE POSE SUR LE MIROIR, PAS ICI : ce job ne tourne que
      # sur `mister-guiiug/mister-family-map` (le `if:` ci-dessus), et `vars`
      # est lu dans le dépôt qui EXÉCUTE. Absente, la ligne vaut la chaîne
      # vide et rien n'est mesuré.
      build-env: |
        VITE_BACKEND=${{ vars.VITE_BACKEND }}
        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
        VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
