# Déploiement GitHub Pages : délégué au reusable pwa-deploy.yml@v4.
#
# 💰 Coût zéro : ne s'exécute QUE sur le dépôt PUBLIC
# mister-guiiug/mister-family-map (Pages + minutes gratuites), après chaque
# publication via `npm run mirror`. Sur le dépôt privé, le job est `skipped`.
# L'app est servie sous https://mister-guiiug.github.io/mister-family-map/
# (base path automatique).
#
# ⚠️ Permissions au niveau caller (héritage par intersection) :
#   - pages: write + id-token: write → déploiement Pages ;
#   - packages: read → installation de @mister-guiiug/dev-pwa-config.
# ⚠️ Ne PAS déclarer `concurrency: pages` ici : le reusable le déclare déjà
# (un doublon caller/reusable provoque un interblocage documenté).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    # Exécution réservée au miroir public — cf. commentaire d'en-tête.
    if: github.repository == 'mister-guiiug/mister-family-map'
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      use-base-path: true
      # Variables de build applicatives (aucun secret ici — la clé anon
      # Supabase est publique par conception, mais elle vit dans les secrets
      # du dépôt pour rester hors du code source) :
      # build-env: |
      #   VITE_SUPABASE_URL=...
      #   VITE_SUPABASE_ANON_KEY=...
