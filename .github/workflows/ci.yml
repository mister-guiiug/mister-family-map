# CI famille : délégué au reusable workflow pwa-ci.yml@v4 de dev-pwa-config
# (format · lint · type-check · test · build · verify-lockfile · E2E · audit).
#
# 💰 Coût zéro : ce workflow ne s'exécute QUE sur le dépôt PUBLIC
# mister-guiiug/mister-family-map (minutes Actions gratuites et illimitées),
# alimenté par `npm run mirror`. Sur le dépôt privé bac-sable — dont les
# minutes Actions ne sont pas disponibles — le job est `skipped` (aucun
# runner demandé, aucune minute, aucun échec) ; la qualité y est garantie
# par `npm run verify`, exigé avant chaque publication.
#
# ⚠️ Permissions déclarées ICI (niveau caller) : les reusable workflows
# héritent des permissions du caller (intersection uniquement).
# `packages: read` est requis pour installer @mister-guiiug/dev-pwa-config
# depuis GitHub Packages (même owner que le dépôt public → GITHUB_TOKEN
# suffit).
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    # Exécution réservée au miroir public — cf. commentaire d'en-tête.
    if: github.repository == 'mister-guiiug/mister-family-map'
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v4
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      # TODO(bootstrap) : le lockfile a été généré sans accès authentifié à
      # GitHub Packages — l'entrée @mister-guiiug/dev-pwa-config n'a donc ni
      # `resolved` ni `integrity` (npm les complète au premier `npm install`
      # authentifié). Étapes : `npm install` en local, committer le lockfile
      # mis à jour, puis repasser verify-lockfile à true.
      verify-lockfile: false
      # La checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2).
      run-doctor: true
      # Audit SCA des dépendances de production (seuil : high).
      run-npm-audit: true
      # E2E (Chromium). Le filtre doit couvrir TOUTES les specs du dossier :
      # Playwright rend « No tests found » avec un code 0 pour une spec qu'il
      # ignore. `@critical` seul écartait `e2e/a11y.spec.ts` (axe-core sur
      # chaque route), jamais jouée depuis son ajout.
      run-e2e: true
      e2e-grep: '@critical|@a11y'
